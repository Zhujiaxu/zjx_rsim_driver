apiVersion: rsim/v1
kind: Plugin
metadata:
  name: rsim-driver
  version: 0.3.0
  description: "EM planner driver plugin — full-stack trajectory planning (path + speed DP/QP) with OpenDRIVE map support and XOSC route following"
  author: "rsim-driver"
  tags: ["driver", "routing", "path"]

spec:
  language: cpp
  entrypoint: librsim_driver.so
  isolation: process
  sync_mode: sync

  capabilities:
    - type: controller
      name: RSimDriver
      domains: []
      mode: passive
      max_actors: 1
      tick_frequency_hz: 0
      properties:
        - name: xodrPath
          type: string
          description: "Absolute path to the OpenDRIVE map (.xodr)."
        - name: routeXoscPath
          type: string
          default: ""
          description: "Runtime OpenSCENARIO path. RSimDriver reads the ego FollowTrajectoryAction as the global route."
        - name: entityName
          type: string
          default: "ego"
          description: "Name of the entity whose FollowTrajectoryAction should be used as the global route."
        - name: routeCsvPath
          type: string
          default: ""
          description: "Optional CSV output path for plugin-generated global path world points."
        - name: referenceLineCsvPath
          type: string
          default: ""
          description: "Optional CSV output path for per-frame reference line debug data."
        - name: obstacleCsvPath
          type: string
          default: ""
          description: "Optional CSV output path for per-frame obstacle snapshots."
        - name: planningStartSlCsvPath
          type: string
          default: ""
          description: "Optional CSV output path for per-frame planning-start Frenet state."
        - name: egoTrajectoryCsvPath
          type: string
          default: ""
          description: "Optional CSV output path for per-frame QP local Frenet/Cartesian plan trajectory."
        - name: setSpeed
          type: double
          default: "13.0"
          description: "Desired cruise speed (m/s)."
  resources:
    tick_timeout_ms: 50 # 单次tick执行时间的超时上限(毫秒)，不是指规划周期
    max_memory_mb: 256
