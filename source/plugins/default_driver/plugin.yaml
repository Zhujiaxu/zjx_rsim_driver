apiVersion: rsim/v1
kind: Plugin
metadata:
  name: default-driver
  version: 0.1.0
  description: "Minimal default driver (constant longitudinal speed)"
  author: "rsim-driver"
  tags: ["driver", "default"]

spec:
  language: cpp
  entrypoint: libdefault_driver.so
  isolation: process
  sync_mode: sync

  capabilities:
    - type: controller
      name: DefaultDriver
      domains: [longitudinal]
      mode: override
      max_actors: 1
      tick_frequency_hz: 0
      properties:
        - name: setSpeed
          type: double
          default: "10.0"
          description: "Constant longitudinal speed (m/s)"

  resources:
    tick_timeout_ms: 50
    max_memory_mb: 128
